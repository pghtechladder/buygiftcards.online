<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d6f54"/>
      <stop offset="0.55" stop-color="#0f8c66"/>
      <stop offset="1" stop-color="#3fc99a"/>
    </linearGradient>
    <linearGradient id="cardSheen" x1="0" y1="0" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- gift card, tilted -->
  <g transform="rotate(-9 50 54)">
    <rect x="21" y="34" width="58" height="40" rx="7" fill="#ffffff"/>
    <rect x="21" y="34" width="58" height="40" rx="7" fill="url(#cardSheen)"/>
    <!-- card stripe -->
    <rect x="21" y="45" width="58" height="7" fill="#0c5844" opacity="0.14"/>
    <!-- chip -->
    <rect x="29" y="56" width="13" height="10" rx="2.5" fill="#ff9f1c"/>
    <!-- number dots -->
    <circle cx="60" cy="61" r="2.6" fill="#0c5844" opacity="0.22"/>
    <circle cx="68" cy="61" r="2.6" fill="#0c5844" opacity="0.22"/>
  </g>

  <!-- sparkle accent -->
  <path d="M74 18 L76.6 25.4 L84 28 L76.6 30.6 L74 38 L71.4 30.6 L64 28 L71.4 25.4 Z" fill="#ff9f1c"/>
  <circle cx="23" cy="24" r="3.2" fill="#ffffff" opacity="0.55"/>
</svg>
